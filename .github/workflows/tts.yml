name: tts-test
on:
  push:
    branches: [photo-fetch]
    paths: ['tts/*.txt', '.github/workflows/tts.yml']
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: synth
        continue-on-error: true
        run: |
          set -x
          exec > >(tee tts/log.txt) 2>&1
          python -m pip install -q edge-tts
          edge-tts --list-voices | grep -i sv-SE || true
          for v in sv-SE-MattiasNeural sv-SE-SofieNeural; do
            edge-tts --voice "$v" --rate=+3% --file tts/budaborgen.txt --write-media "tts/edge-$v.mp3"
          done
          ls -la tts
      - name: commit
        if: always()
        run: |
          git config user.name "tts-test"
          git config user.email "tts-test@users.noreply.github.com"
          git add -f tts/
          git commit -m "TTS test audio (edge voices)" || echo "nothing to commit"
          git push
