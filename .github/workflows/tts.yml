name: tts-test
on:
  push:
    branches: [photo-fetch]
    paths: ['tts/*.txt', '.github/workflows/tts.yml']
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: kokoro
        continue-on-error: true
        run: |
          set -x
          exec > >(tee tts/log-kokoro.txt) 2>&1
          sudo apt-get install -y -qq espeak-ng >/dev/null
          python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -q "kokoro>=0.9.4" soundfile
          cat > /tmp/k.py <<'PY'
          import glob, os, numpy as np, soundfile as sf
          from kokoro import KPipeline
          pipe = KPipeline(lang_code='b', repo_id='hexgrad/Kokoro-82M')
          for f in sorted(glob.glob('tts/vis-quiz-*.txt')):
              out = f[:-4] + '-bm_george.wav'
              if os.path.exists(out) and os.path.getmtime(out) > os.path.getmtime(f): continue
              text = open(f, encoding='utf-8').read()
              parts = []
              for r in pipe(text, voice='bm_george', speed=1.0, split_pattern=r'\n+'):
                  a = r[2] if isinstance(r, tuple) else r.audio
                  a = a.cpu().numpy() if hasattr(a, 'cpu') else np.asarray(a)
                  parts += [a, np.zeros(int(24000 * (2.8 if 'facts' in f else 0.5)), dtype=a.dtype)]
              sf.write(out, np.concatenate(parts), 24000)
              print('done', out)
          PY
          python /tmp/k.py
      - name: commit
        if: always()
        run: |
          ls -la tts
          git config user.name "tts-test"
          git config user.email "tts-test@users.noreply.github.com"
          git add -f tts/
          git commit -m "TTS audio (Visegrád)" || echo "nothing to commit"
          git push
